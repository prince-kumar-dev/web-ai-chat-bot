<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Include Pygments CSS for code highlighting if you expect code in responses -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pygments/2.15.1/styles/default.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome for Icons -->
</head>
<body>
    <div class="chat-container">
        <h1><i class="fas fa-robot"></i> AI Chatbot</h1>
        <div id="chat-window" class="chat-window">
            <!-- Chat messages will appear here -->
             <div class="message bot-message">
                <i class="fas fa-brain bot-icon"></i>
                <div class="message-content"><p>Hello! How can I help you today?</p></div>
            </div>
        </div>
        <div id="input-area" class="input-area">
            <textarea id="message-input" placeholder="Type your message here..." rows="1"></textarea>
            <button id="send-button" title="Send Message"><i class="fas fa-paper-plane"></i></button>
            <button id="clear-button" title="Clear Chat History"><i class="fas fa-trash-alt"></i></button>
        </div>
        <div id="thinking-indicator" class="thinking-indicator" style="display: none;">
             <i class="fas fa-spinner fa-spin"></i> Thinking...
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
